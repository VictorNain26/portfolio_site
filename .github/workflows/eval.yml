# Live evaluation of the assistant against Mistral, gated by evals/agent.test.ts.
# Paths: https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
name: Agent evaluation

on:
  # Every pull request, so that the required `evaluate` check always reports: a workflow
  # skipped by a paths filter stays pending and blocks the merge, a skipped job passes.
  # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/using-conditions-to-control-job-execution
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      # https://github.com/dorny/paths-filter
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            agent:
              - 'src/lib/agent/**'
              - 'src/pages/api/ask.ts'
              - 'src/content/persona.md'
              - 'src/content/posts/**'
              - 'src/data/projects.ts'
              - 'src/lib/posts.ts'
              - 'src/lib/projects.ts'
              - 'scripts/github.ts'
              - 'evals/**'
              - 'package-lock.json'
              - '.github/workflows/eval.yml'

  evaluate:
    needs: changes
    # Runs on demand, or when a pull request touches what the agent reads. Secrets never reach
    # pull requests from forks: the run would only fail.
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      (needs.changes.outputs.agent == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      # Code search needs a token that reads the public repos; secret names cannot start with GITHUB_.
      GITHUB_TOKEN: ${{ secrets.PUBLIC_REPOS_TOKEN }}
      EVAL_RUNS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval
