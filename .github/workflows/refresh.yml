name: Refresh

# Projects are read from GitHub at build time: rebuilding every hour keeps /projets in step.
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
# https://vercel.com/docs/deploy-hooks
on:
  schedule:
    # Off the top of the hour, when GitHub delays scheduled runs.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
