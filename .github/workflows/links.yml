name: Links

# Posts link to repos, files, commits and sites that can move or disappear: check them every
# week, and on pull requests that touch a post.
# https://github.com/lycheeverse/lychee-action
on:
  schedule:
    - cron: '23 6 * * 1'
  pull_request:
    paths:
      - 'src/content/posts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Root-relative links (/blog/…) resolve against the live site, so a post that links to
          # another one not deployed yet fails until that one is live.
          args: >-
            --no-progress --base-url https://www.victorlenain.fr --root-dir /
            'src/content/posts/*.mdx'
          fail: true
          jobSummary: true
          token: ${{ github.token }}
